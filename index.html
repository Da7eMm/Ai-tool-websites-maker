<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomy Lab — تعلّم أعضاء الجسم بالإنجليزي</title>
<meta name="description" content="موقع تفاعلي ثلاثي الأبعاد لتعلّم أسماء أعضاء الجسم بالإنجليزي مع الترجمة والنطق واختبارات تفاعلية">
<meta property="og:title" content="Anatomy Lab — تعلّم أعضاء الجسم بالإنجليزي">
<meta property="og:description" content="جسم بشري 3D تفاعلي، بطاقات تعلّم مقلوبة، نطق صوتي، واختبار لكل جهاز من أجهزة الجسم">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🫀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A1420;
    --panel: #101E2E;
    --panel2: #14263A;
    --line: #1E3448;
    --teal: #4FD1C5;
    --coral: #FF6859;
    --gold: #FBBF24;
    --text: #F1F5F9;
    --sub: #7C93AC;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; background:var(--bg); color:var(--text); font-family:'Cairo',sans-serif; overflow:hidden;}
  .en{font-family:'Space Grotesk','Inter',sans-serif; direction:ltr; unicode-bidi:isolate;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--teal); outline-offset:2px;}

  #app{display:grid; grid-template-columns: 1fr 380px; height:100vh; width:100vw;}
  #stage{position:relative; overflow:hidden; background: radial-gradient(circle at 30% 20%, #122336 0%, var(--bg) 55%); touch-action:none;}
  #stage canvas{display:block; touch-action:none;}

  #loadingOverlay{position:absolute; inset:0; background:var(--bg); z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; transition:opacity .5s;}
  .spinner{width:34px; height:34px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--teal); animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #loadingOverlay p{color:var(--sub); font-size:13px; font-weight:600;}

  .topbar{position:absolute; top:0; right:0; left:0; z-index:5; display:flex; align-items:flex-start; justify-content:space-between; padding:16px 20px; pointer-events:none;}
  .brand{display:flex; align-items:center; gap:10px; pointer-events:auto;}
  .brand .dot{width:10px; height:10px; border-radius:50%; background:var(--teal); box-shadow:0 0 12px var(--teal);}
  .brand h1{font-size:15px; font-weight:800; letter-spacing:.5px;}
  .brand small{display:block; font-size:11px; color:var(--sub); font-weight:500; margin-top:1px;}

  .modebar{display:flex; gap:8px; pointer-events:auto; align-items:center;}
  .modebtn{background:var(--panel); border:1px solid var(--line); color:var(--sub); padding:9px 16px; border-radius:999px; font-family:'Cairo'; font-weight:700; font-size:13px; cursor:pointer; transition:.2s;}
  .modebtn:hover{border-color:var(--teal); color:var(--text);}
  .modebtn.active{background:var(--teal); color:#052226; border-color:var(--teal);}
  .iconbtn{width:36px; height:36px; border-radius:50%; background:var(--panel); border:1px solid var(--line); color:var(--sub); cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; transition:.2s;}
  .iconbtn:hover{border-color:var(--teal); color:var(--text);}

  .systembar{position:absolute; top:66px; right:20px; left:20px; z-index:5; display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; pointer-events:auto;}
  .systembar::-webkit-scrollbar{height:4px;}
  .syschip{flex-shrink:0; background:rgba(16,30,46,.85); backdrop-filter:blur(6px); border:1px solid var(--line); color:var(--sub); padding:7px 14px; border-radius:999px; font-family:'Cairo'; font-weight:700; font-size:12px; cursor:pointer; white-space:nowrap; transition:.15s;}
  .syschip:hover{color:var(--text); border-color:#345267;}
  .syschip.active{background:var(--coral); color:#2A0B08; border-color:var(--coral);}

  .hint{position:absolute; bottom:16px; right:20px; left:20px; z-index:5; text-align:center; color:var(--sub); font-size:12px; font-weight:500; pointer-events:none;}
  .hint .en{color:var(--teal); font-weight:600;}

  .pill{position:absolute; transform:translate(-50%,-100%); pointer-events:auto; cursor:pointer; z-index:4; transition:opacity .2s;}
  .pill .ring{width:13px; height:13px; border-radius:50%; border:2px solid var(--coral); background:rgba(255,104,89,.25); position:relative;}
  .pill .ring::after{content:''; position:absolute; inset:-6px; border-radius:50%; border:1px solid var(--coral); opacity:.5; animation:pulse 2s infinite;}
  .pill.done .ring{border-color:var(--teal); background:rgba(79,209,197,.3);}
  .pill.done .ring::after{border-color:var(--teal);}
  @keyframes pulse{0%{transform:scale(.6); opacity:.8;} 100%{transform:scale(1.9); opacity:0;}}

  #side{background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; height:100vh; overflow:hidden;}
  .side-head{padding:18px 20px 12px; border-bottom:1px solid var(--line);}
  .side-head-row{display:flex; align-items:center; justify-content:space-between;}
  .side-head h2{font-size:13px; font-weight:800; color:var(--sub); letter-spacing:.3px;}
  .reset-link{font-size:11px; color:var(--sub); background:none; border:none; cursor:pointer; text-decoration:underline; font-family:'Cairo'; font-weight:600;}
  .reset-link:hover{color:var(--coral);}
  .progress-row{display:flex; align-items:center; gap:8px; margin-top:9px;}
  .progress-track{flex:1; height:5px; background:var(--line); border-radius:999px; overflow:hidden;}
  .progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--teal),#7CF0E4); transition:width .4s;}
  .progress-num{font-size:11px; color:var(--sub); font-weight:600; font-family:'Inter';}

  .card-wrap{padding:16px 18px; perspective:1200px;}
  .card{height:210px; position:relative; cursor:pointer;}
  .card-inner{position:relative; width:100%; height:100%; text-align:center; transform-style:preserve-3d; transition:transform .55s cubic-bezier(.4,.2,.2,1); border-radius:18px;}
  .card.flipped .card-inner{transform:rotateY(180deg);}
  .face{position:absolute; inset:0; backface-visibility:hidden; border-radius:18px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; border:1px solid var(--line);}
  .face-front{background:linear-gradient(160deg,var(--panel2),var(--panel));}
  .face-back{background:linear-gradient(160deg,#1B2E22,#122019); transform:rotateY(180deg); border-color:#2C4A3A;}

  .empty-state{color:var(--sub); font-size:13px; line-height:1.9;}
  .empty-state .en{display:block; color:var(--teal); font-size:19px; margin-top:8px; font-weight:700;}

  .organ-tag{font-size:10.5px; color:var(--sub); font-weight:600; letter-spacing:.4px; text-transform:uppercase;}
  .organ-en-row{display:flex; align-items:center; gap:9px; margin:8px 0 4px;}
  .organ-en{font-size:30px; font-weight:700; color:var(--text);}
  .speak-btn{width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:rgba(79,209,197,.08); color:var(--teal); cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:.15s;}
  .speak-btn:hover{background:var(--teal); color:#052226;}
  .organ-translit{font-size:12.5px; color:var(--gold); font-weight:600; margin-bottom:6px;}
  .flip-hint{font-size:10.5px; color:var(--sub); margin-top:8px;}
  .flip-hint .en{color:var(--teal);}
  .organ-ar{font-size:25px; font-weight:800; color:#8FF0D8; margin-bottom:9px;}
  .example{font-size:12px; line-height:1.75; color:#C9D8E0;}
  .example-row{display:flex; align-items:center; gap:6px; justify-content:center;}
  .example .en{color:var(--text); font-weight:500;}

  .list-wrap{flex:1; overflow-y:auto; padding:0 12px 16px;}
  .list-wrap::-webkit-scrollbar{width:6px;}
  .list-wrap::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}
  .sys-label{font-size:10.5px; color:var(--sub); font-weight:800; letter-spacing:.5px; padding:12px 10px 6px; text-transform:uppercase;}
  .organ-item{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; border-radius:12px; cursor:pointer; margin-bottom:3px; border:1px solid transparent; transition:.15s;}
  .organ-item:hover{background:var(--panel2);}
  .organ-item.active{background:rgba(79,209,197,.1); border-color:var(--teal);}
  .organ-item .left{display:flex; align-items:center; gap:9px;}
  .organ-item .swatch{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .organ-item .name-ar{font-size:13.5px; font-weight:700;}
  .organ-item .name-en{font-size:10.5px; color:var(--sub); display:block; margin-top:1px;}
  .organ-item .check{font-size:13px; color:var(--teal); opacity:0; transition:.2s;}
  .organ-item.learned .check{opacity:1;}

  #quizPanel{display:none; flex:1; flex-direction:column; padding:18px; overflow-y:auto;}
  .quiz-q{background:var(--panel2); border:1px solid var(--line); border-radius:16px; padding:20px; text-align:center;}
  .quiz-q .lbl{font-size:10.5px; color:var(--sub); font-weight:700; letter-spacing:.4px; margin-bottom:9px;}
  .quiz-q .ar{font-size:24px; font-weight:800; color:#8FF0D8;}
  .quiz-choices{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:14px;}
  .choice-btn{background:var(--panel2); border:1px solid var(--line); color:var(--text); padding:13px 8px; border-radius:12px; font-family:'Space Grotesk'; font-weight:600; font-size:14px; cursor:pointer; transition:.15s; direction:ltr;}
  .choice-btn:hover:not(:disabled){border-color:var(--teal);}
  .choice-btn:disabled{cursor:default;}
  .choice-btn.correct{background:rgba(79,209,197,.18); border-color:var(--teal); color:var(--teal);}
  .choice-btn.wrong{background:rgba(255,104,89,.18); border-color:var(--coral); color:var(--coral);}
  .quiz-msg{margin-top:12px; text-align:center; font-size:13px; font-weight:700; min-height:20px;}
  .quiz-msg.ok{color:var(--teal);}
  .quiz-msg.no{color:var(--coral);}
  .quiz-score{margin-top:auto; padding-top:14px; text-align:center; color:var(--sub); font-size:11.5px; font-family:'Inter'; font-weight:600;}
  .quiz-done{text-align:center; padding:26px 10px;}
  .quiz-done .big{font-size:38px; font-weight:800; color:var(--teal); font-family:'Space Grotesk';}
  .quiz-done .best{font-size:11.5px; color:var(--sub); margin-top:4px; font-family:'Inter';}
  .restart-btn{margin-top:14px; background:var(--teal); color:#052226; border:none; padding:10px 22px; border-radius:999px; font-family:'Cairo'; font-weight:800; cursor:pointer;}

  @media (max-width:820px){
    #app{grid-template-columns:1fr; grid-template-rows: 48vh 1fr;}
    #side{border-right:none; border-top:1px solid var(--line);}
    .card{height:190px;}
    .systembar{top:60px;}
  }
</style>
</head>
<body>

<div id="app">
  <div id="stage">
    <div id="loadingOverlay"><div class="spinner"></div><p>...جاري تجهيز النموذج ثلاثي الأبعاد</p></div>
    <div class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <div><h1>Anatomy Lab</h1><small>تعلّم أسماء أعضاء الجسم بالإنجليزي</small></div>
      </div>
      <div class="modebar">
        <button class="modebtn active" id="btnExplore">🧭 استكشاف</button>
        <button class="modebtn" id="btnQuiz">🎯 اختبار</button>
        <button class="iconbtn" id="btnResetView" title="إعادة ضبط الكاميرا">⟳</button>
      </div>
    </div>
    <div class="systembar" id="systembar"></div>
    <div id="pills"></div>
    <div class="hint">اسحب لتدوير الجسم — <span class="en">scroll</span> للتقريب — دوس على أي نقطة لتتعلم اسم العضو</div>
  </div>

  <div id="side">
    <div class="side-head">
      <div class="side-head-row">
        <h2>تقدّمك في التعلّم</h2>
        <button class="reset-link" id="resetProgress">إعادة تعيين</button>
      </div>
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
        <span class="progress-num" id="progNum">0/16</span>
      </div>
    </div>

    <div id="explorePanel" style="display:flex; flex-direction:column; flex:1; overflow:hidden;">
      <div class="card-wrap">
        <div class="card" id="card">
          <div class="card-inner" id="cardInner">
            <div class="face face-front" id="faceFront">
              <div class="empty-state">اختر عضوًا من النموذج ثلاثي الأبعاد<br>أو من القائمة بالأسفل
                <span class="en">Tap an organ to begin</span>
              </div>
            </div>
            <div class="face face-back" id="faceBack"></div>
          </div>
        </div>
      </div>
      <div class="list-wrap" id="listWrap"></div>
    </div>

    <div id="quizPanel"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------------- TTS ---------------- */
function speak(text){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.88; u.pitch = 1;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------------- PERSISTENCE ---------------- */
const STORAGE_KEY = 'anatomyLab_v2';
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return {learned:[], bestScore:0};
    return JSON.parse(raw);
  }catch(e){ return {learned:[], bestScore:0}; }
}
function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({learned:[...learned], bestScore}));
  }catch(e){}
}
let bestScore = 0;

/* ---------------- SYSTEMS ---------------- */
const SYSTEMS = [
  {id:'all', ar:'الكل', en:'All'},
  {id:'nervous', ar:'الجهاز العصبي', en:'Nervous'},
  {id:'sensory', ar:'الحواس', en:'Senses'},
  {id:'respiratory', ar:'الجهاز التنفسي', en:'Respiratory'},
  {id:'circulatory', ar:'الجهاز الدوري', en:'Circulatory'},
  {id:'digestive', ar:'الجهاز الهضمي', en:'Digestive'},
  {id:'urinary', ar:'الجهاز البولي', en:'Urinary'},
  {id:'skeletal', ar:'الهيكل العظمي', en:'Skeletal'},
  {id:'muscular', ar:'الجهاز العضلي', en:'Muscular'},
];
let activeSystem = 'all';

/* ---------------- DATA ---------------- */
const ORGANS = [
  {id:'brain', en:'Brain', ar:'الدماغ', tr:'بْرِيْن', color:0xF2A6A6, system:'nervous',
   ex_en:'The brain controls your whole body.', ex_ar:'الدماغ يتحكّم في جسمك بالكامل.',
   pos:[0,1.62,0.03], size:0.15, geo:'sphere'},
  {id:'skull', en:'Skull', ar:'الجمجمة', tr:'سْكَل', color:0xE7E2D2, system:'skeletal',
   ex_en:'The skull protects the brain.', ex_ar:'الجمجمة تحمي الدماغ.',
   pos:[0,1.62,0], size:0.25, geo:'wiresphere'},
  {id:'eyes', en:'Eyes', ar:'العينان', tr:'آيْز', color:0x6FB4E8, system:'sensory', mirror:true,
   ex_en:'We see with our eyes.', ex_ar:'نبصر بواسطة عينينا.',
   pos:[0.08,1.645,0.185], size:0.032, geo:'sphere'},
  {id:'trachea', en:'Trachea', ar:'القصبة الهوائية', tr:'تْرِيْكِيا', color:0xD8C9B8, system:'respiratory',
   ex_en:'Air travels through the trachea.', ex_ar:'يمرّ الهواء عبر القصبة الهوائية.',
   pos:[0,1.44,0.06], size:0.032, height:0.16, geo:'cyl'},
  {id:'heart', en:'Heart', ar:'القلب', tr:'هَارْت', color:0xE84C4C, system:'circulatory',
   ex_en:'My heart beats faster when I run.', ex_ar:'قلبي يخفق أسرع عندما أجري.',
   pos:[-0.09,1.10,0.14], size:0.11, geo:'icosahedron'},
  {id:'lungs', en:'Lungs', ar:'الرئتان', tr:'لَنْغْز', color:0xF29AAE, system:'respiratory', mirror:true,
   ex_en:'We breathe with our lungs.', ex_ar:'نتنفّس بواسطة رئتينا.',
   pos:[0.13,1.13,0.10], size:0.12, geo:'sphere'},
  {id:'ribcage', en:'Ribcage', ar:'القفص الصدري', tr:'رِبْكِيج', color:0xEFE7D4, system:'skeletal',
   ex_en:'The ribcage protects the heart and lungs.', ex_ar:'القفص الصدري يحمي القلب والرئتين.',
   pos:[0,1.10,0], size:0.34, geo:'wiresphere'},
  {id:'liver', en:'Liver', ar:'الكبد', tr:'لِيْفَر', color:0x8B4A3D, system:'digestive',
   ex_en:'The liver cleans your blood.', ex_ar:'الكبد ينقّي دمك.',
   pos:[0.15,0.90,0.12], size:0.13, geo:'box'},
  {id:'stomach', en:'Stomach', ar:'المعدة', tr:'سْتَمَك', color:0xC77DBB, system:'digestive',
   ex_en:'I ate too much and my stomach hurts.', ex_ar:'أكلت كثيرًا ومعدتي تؤلمني.',
   pos:[-0.11,0.87,0.13], size:0.115, geo:'sphere'},
  {id:'pancreas', en:'Pancreas', ar:'البنكرياس', tr:'بَانْكْرِياس', color:0xE0B060, system:'digestive',
   ex_en:'The pancreas helps digest food.', ex_ar:'البنكرياس يساعد على هضم الطعام.',
   pos:[0.02,0.83,-0.03], size:0.09, geo:'box'},
  {id:'kidneys', en:'Kidneys', ar:'الكليتان', tr:'كِدْنِيز', color:0x7A3B3B, system:'urinary', mirror:true,
   ex_en:'Kidneys filter waste from the blood.', ex_ar:'الكليتان تصفّيان الفضلات من الدم.',
   pos:[0.16,0.80,-0.11], size:0.07, geo:'sphere'},
  {id:'bladder', en:'Bladder', ar:'المثانة', tr:'بْلادَر', color:0xE0C840, system:'urinary',
   ex_en:'The bladder stores urine.', ex_ar:'المثانة تخزّن البول.',
   pos:[0,0.56,0.10], size:0.06, geo:'sphere'},
  {id:'intestines', en:'Intestines', ar:'الأمعاء', tr:'إِنْتِسْتِنْز', color:0xD98E5C, system:'digestive',
   ex_en:'Food moves slowly through the intestines.', ex_ar:'يتحرّك الطعام ببطء عبر الأمعاء.',
   pos:[0,0.65,0.11], size:0.16, geo:'torusknot'},
  {id:'spine', en:'Spine', ar:'العمود الفقري', tr:'سْبَايْن', color:0xE8E0C8, system:'skeletal',
   ex_en:'The spine supports your back.', ex_ar:'العمود الفقري يدعم ظهرك.',
   pos:[0,0.95,-0.17], size:0.02, height:1.0, geo:'cyl'},
  {id:'femur', en:'Femur', ar:'عظمة الفخذ', tr:'فِيمَر', color:0xF3EEDA, system:'skeletal',
   ex_en:'The femur is the longest bone in the body.', ex_ar:'عظمة الفخذ أطول عظمة في الجسم.',
   pos:[0.15,-0.05,0], size:0.035, height:0.62, geo:'cyl'},
  {id:'bicep', en:'Bicep', ar:'العضلة ذات الرأسين', tr:'بَايْسَبْ', color:0xC0453B, system:'muscular',
   ex_en:'He flexed his bicep muscle.', ex_ar:'قام بشدّ عضلة الذراع.',
   pos:[-0.395,1.18,0.02], size:0.085, geo:'sphere', squash:[0.85,1.9,0.85]},
];
const byId = Object.fromEntries(ORGANS.map(o=>[o.id,o]));
const saved = loadProgress();
let learned = new Set(saved.learned || []);
bestScore = saved.bestScore || 0;

/* ---------------- THREE SETUP ---------------- */
const stage = document.getElementById('stage');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, stage.clientWidth/stage.clientHeight, 0.1, 100);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(stage.clientWidth, stage.clientHeight);
stage.appendChild(renderer.domElement);

const DEFAULT_CAM = {radius:2.55, theta:0.35, phi:1.25};
const target = new THREE.Vector3(0,1.0,0);
let camState = {...DEFAULT_CAM};
let dragging=false, lastX=0, lastY=0, idleTimer=null, userActive=false;
function applyCam(){
  const {radius,theta,phi} = camState;
  camera.position.set(
    target.x + radius*Math.sin(phi)*Math.sin(theta),
    target.y + radius*Math.cos(phi),
    target.z + radius*Math.sin(phi)*Math.cos(theta)
  );
  camera.lookAt(target);
}
applyCam();
const dom = renderer.domElement;
let downPos = null;
dom.addEventListener('pointerdown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; userActive=true; clearTimeout(idleTimer); dom.setPointerCapture(e.pointerId); downPos=[e.clientX,e.clientY]; });
dom.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
  camState.theta -= dx*0.006;
  camState.phi = Math.min(Math.max(camState.phi - dy*0.006, 0.35), Math.PI-0.35);
  applyCam();
});
function endDrag(e){
  dragging=false; idleTimer=setTimeout(()=>userActive=false, 3000);
  if(!downPos) return;
  const moved = Math.hypot(e.clientX-downPos[0], e.clientY-downPos[1]);
  if(moved<=6) handlePick(e);
}
dom.addEventListener('pointerup', endDrag);
dom.addEventListener('pointercancel', ()=>{dragging=false;});
dom.addEventListener('wheel', e=>{
  e.preventDefault();
  camState.radius = Math.min(Math.max(camState.radius + e.deltaY*0.0025, 1.3), 4.6);
  applyCam();
}, {passive:false});
document.getElementById('btnResetView').addEventListener('click', ()=>{
  camState = {...DEFAULT_CAM}; userActive=false; applyCam();
});

scene.add(new THREE.AmbientLight(0x6f8ba8, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(2,3,2); scene.add(key);
const rim = new THREE.DirectionalLight(0x4fd1c5, 0.5); rim.position.set(-2,1,-2); scene.add(rim);

const bodyGroup = new THREE.Group();
scene.add(bodyGroup);

const skinMat = new THREE.MeshPhongMaterial({color:0xE8C4A0, transparent:true, opacity:0.13, depthWrite:false, side:THREE.DoubleSide, shininess:20});
function addSkin(geo,pos,rot,scale){
  const m = new THREE.Mesh(geo, skinMat);
  m.position.set(...pos);
  if(rot) m.rotation.set(...rot);
  if(scale) m.scale.set(...scale);
  bodyGroup.add(m);
}
addSkin(new THREE.SphereGeometry(0.22,24,24), [0,1.62,0]);
addSkin(new THREE.CylinderGeometry(0.08,0.09,0.12,16), [0,1.46,0]);
addSkin(new THREE.CylinderGeometry(0.30,0.36,0.78,24), [0,1.05,0]);
addSkin(new THREE.SphereGeometry(0.26,20,20), [0,0.63,0], null, [1,0.65,0.8]);
[-1,1].forEach(s=>{
  addSkin(new THREE.CylinderGeometry(0.055,0.07,0.85,14), [s*0.40,1.05,0], [0,0,s*0.22]);
  addSkin(new THREE.CylinderGeometry(0.09,0.11,0.95,14), [s*0.15,-0.02,0]);
});

/* soft ground shadow (fake) */
const groundGeo = new THREE.CircleGeometry(0.65,32);
const groundMat = new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:0.35});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.52;
scene.add(ground);

/* organ meshes + markers */
const organMeshes = {};
const markers = [];
function makeGeo(o){
  switch(o.geo){
    case 'sphere': return new THREE.SphereGeometry(o.size,20,20);
    case 'wiresphere': return new THREE.SphereGeometry(o.size,14,10);
    case 'icosahedron': return new THREE.IcosahedronGeometry(o.size,1);
    case 'box': return new THREE.BoxGeometry(o.size*1.3,o.size*0.9,o.size*0.9);
    case 'torusknot': return new THREE.TorusKnotGeometry(o.size*0.55,o.size*0.17,64,8);
    case 'cyl': return new THREE.CylinderGeometry(o.size,o.size,o.height||0.2,12);
    default: return new THREE.SphereGeometry(o.size,16,16);
  }
}
function makeMat(o){
  if(o.geo==='wiresphere') return new THREE.MeshBasicMaterial({color:o.color, wireframe:true, transparent:true, opacity:0.35});
  return new THREE.MeshPhongMaterial({color:o.color, shininess:60});
}
ORGANS.forEach(o=>{
  const mat = makeMat(o);
  const positions = o.mirror ? [[o.pos[0],o.pos[1],o.pos[2]], [-o.pos[0],o.pos[1],o.pos[2]]] : [o.pos];
  organMeshes[o.id] = [];
  positions.forEach(p=>{
    const mesh = new THREE.Mesh(makeGeo(o), mat.clone ? mat.clone() : mat);
    mesh.position.set(...p);
    if(o.squash) mesh.scale.set(...o.squash);
    bodyGroup.add(mesh);
    organMeshes[o.id].push(mesh);
  });
  addMarker(organMeshes[o.id][0], o, [o.size*1.3+0.03, (o.height? o.height/2:o.size*0.7), o.size*0.6]);
});
function addMarker(mesh, organ, localOffset){ markers.push({mesh, organ, offset: localOffset || [0,0.1,0]}); }

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
function handlePick(e){
  const rect = dom.getBoundingClientRect();
  mouse.x = ((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y = -((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const all = Object.values(organMeshes).flat().filter(m=>m.visible);
  const hits = raycaster.intersectObjects(all);
  if(hits.length){
    const hitMesh = hits[0].object;
    const found = ORGANS.find(o => organMeshes[o.id].includes(hitMesh));
    if(found) selectOrgan(found.id);
  }
}

let firstFrame = true;
function animate(){
  requestAnimationFrame(animate);
  if(!userActive){ camState.theta += 0.0018; applyCam(); }
  updatePills();
  renderer.render(scene,camera);
  if(firstFrame){
    firstFrame=false;
    const ov = document.getElementById('loadingOverlay');
    ov.style.opacity='0';
    setTimeout(()=>ov.style.display='none', 500);
  }
}
animate();

window.addEventListener('resize', ()=>{
  camera.aspect = stage.clientWidth/stage.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(stage.clientWidth, stage.clientHeight);
});

/* ---------------- SYSTEM FILTER ---------------- */
const systembar = document.getElementById('systembar');
SYSTEMS.forEach(s=>{
  const chip = document.createElement('div');
  chip.className = 'syschip'+(s.id==='all'?' active':'');
  chip.id = 'sys-'+s.id;
  chip.innerHTML = s.ar;
  chip.addEventListener('click', ()=> setSystem(s.id));
  systembar.appendChild(chip);
});
function setSystem(id){
  activeSystem = id;
  document.querySelectorAll('.syschip').forEach(c=>c.classList.remove('active'));
  document.getElementById('sys-'+id).classList.add('active');
  ORGANS.forEach(o=>{
    const show = (id==='all') || (o.system===id);
    organMeshes[o.id].forEach(m=> m.visible = show);
    if(pillEls[o.id]) pillEls[o.id].style.display = show ? '' : 'none';
  });
  skinMat.opacity = (id==='all') ? 0.13 : 0.07;
  renderList();
}

/* ---------------- PILLS ---------------- */
const pillsWrap = document.getElementById('pills');
const pillEls = {};
markers.forEach(m=>{
  const el = document.createElement('div');
  el.className='pill';
  el.innerHTML = '<span class="ring"></span>';
  el.title = m.organ.en;
  el.addEventListener('click', ()=> selectOrgan(m.organ.id));
  pillsWrap.appendChild(el);
  pillEls[m.organ.id] = el;
});
const tmpV = new THREE.Vector3();
function updatePills(){
  markers.forEach(m=>{
    if(!m.mesh.visible) return;
    tmpV.copy(m.mesh.position).add(new THREE.Vector3(...m.offset));
    tmpV.applyMatrix4(bodyGroup.matrixWorld);
    const projected = tmpV.clone().project(camera);
    const behind = projected.z > 1;
    const x = (projected.x*0.5+0.5) * stage.clientWidth;
    const y = (1-(projected.y*0.5+0.5)) * stage.clientHeight;
    const el = pillEls[m.organ.id];
    el.style.left = x+'px';
    el.style.top = y+'px';
    el.style.opacity = behind ? '0' : '1';
    el.style.pointerEvents = behind ? 'none' : 'auto';
    el.classList.toggle('done', learned.has(m.organ.id));
  });
}

/* ---------------- SIDEBAR LIST ---------------- */
const listWrap = document.getElementById('listWrap');
function renderList(){
  listWrap.innerHTML = '';
  const groups = activeSystem==='all' ? SYSTEMS.filter(s=>s.id!=='all') : SYSTEMS.filter(s=>s.id===activeSystem);
  groups.forEach(g=>{
    const items = ORGANS.filter(o=>o.system===g.id);
    if(!items.length) return;
    const label = document.createElement('div');
    label.className='sys-label';
    label.textContent = g.ar;
    listWrap.appendChild(label);
    items.forEach(o=>{
      const item = document.createElement('div');
      item.className='organ-item'+(learned.has(o.id)?' learned':'');
      item.id = 'item-'+o.id;
      item.innerHTML = `
        <div class="left">
          <span class="swatch" style="background:#${o.color.toString(16).padStart(6,'0')}"></span>
          <div><div class="name-ar">${o.ar}</div><span class="name-en en">${o.en}</span></div>
        </div>
        <span class="check">✓</span>`;
      item.addEventListener('click', ()=> selectOrgan(o.id));
      listWrap.appendChild(item);
    });
  });
}
renderList();

/* ---------------- FLASHCARD ---------------- */
const card = document.getElementById('card');
const faceFront = document.getElementById('faceFront');
const faceBack = document.getElementById('faceBack');
let currentOrgan = null;
function selectOrgan(id){
  if(!byId[id]) return;
  currentOrgan = byId[id];
  learned.add(id);
  updateProgress();
  saveProgress();
  card.classList.remove('flipped');
  faceFront.innerHTML = `
    <div class="organ-tag">اضغط على البطاقة لترى الترجمة</div>
    <div class="organ-en-row">
      <div class="organ-en en">${currentOrgan.en}</div>
      <button class="speak-btn" id="speakWord" title="استمع للنطق">🔊</button>
    </div>
    <div class="organ-translit">${currentOrgan.tr}</div>
    <div class="flip-hint">اقلب البطاقة <span class="en">flip →</span></div>`;
  faceBack.innerHTML = `
    <div class="organ-tag">Arabic</div>
    <div class="organ-ar">${currentOrgan.ar}</div>
    <div class="example-row">
      <button class="speak-btn" id="speakEx" title="استمع للجملة">🔊</button>
      <div class="example"><span class="en">${currentOrgan.ex_en}</span></div>
    </div>
    <div class="example" style="margin-top:6px;">${currentOrgan.ex_ar}</div>`;
  document.getElementById('speakWord').addEventListener('click', ev=>{ ev.stopPropagation(); speak(currentOrgan.en); });
  document.getElementById('speakEx').addEventListener('click', ev=>{ ev.stopPropagation(); speak(currentOrgan.ex_en); });
  document.querySelectorAll('.organ-item').forEach(el=>el.classList.remove('active'));
  const it = document.getElementById('item-'+id);
  if(it){ it.classList.add('active'); it.classList.add('learned'); it.scrollIntoView({block:'nearest', behavior:'smooth'}); }
}
card.addEventListener('click', ()=>{ if(currentOrgan) card.classList.toggle('flipped'); });
function updateProgress(){
  document.getElementById('progNum').textContent = learned.size+'/'+ORGANS.length;
  document.getElementById('progFill').style.width = (learned.size/ORGANS.length*100)+'%';
}
updateProgress();
document.getElementById('resetProgress').addEventListener('click', ()=>{
  if(!confirm('تصفير كل التقدّم المحفوظ؟')) return;
  learned = new Set(); bestScore = 0; saveProgress(); updateProgress(); renderList();
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('done'));
});

/* ---------------- MODE SWITCH ---------------- */
const btnExplore = document.getElementById('btnExplore');
const btnQuiz = document.getElementById('btnQuiz');
const explorePanel = document.getElementById('explorePanel');
const quizPanel = document.getElementById('quizPanel');
btnExplore.addEventListener('click', ()=>{
  btnExplore.classList.add('active'); btnQuiz.classList.remove('active');
  explorePanel.style.display='flex'; quizPanel.style.display='none';
});
btnQuiz.addEventListener('click', ()=>{
  btnQuiz.classList.add('active'); btnExplore.classList.remove('active');
  explorePanel.style.display='none'; quizPanel.style.display='flex';
  startQuiz();
});

/* ---------------- QUIZ ---------------- */
let quizOrder = [], quizIdx = 0, quizScore = 0, quizTotal = 0, answered=false;
function shuffle(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }
function startQuiz(){
  const pool = (activeSystem==='all') ? ORGANS.map(o=>o.id) : ORGANS.filter(o=>o.system===activeSystem).map(o=>o.id);
  quizOrder = shuffle(pool);
  quizTotal = quizOrder.length;
  quizIdx = 0; quizScore = 0;
  renderQuizShell();
  nextQuizQuestion();
}
function renderQuizShell(){
  quizPanel.innerHTML = `
    <div class="quiz-q">
      <div class="lbl">ابحث عن هذا العضو، أو اختر اسمه بالإنجليزي</div>
      <div class="ar" id="quizAr">—</div>
      <div class="quiz-choices" id="quizChoices"></div>
    </div>
    <div class="quiz-msg" id="quizMsg"></div>
    <div class="quiz-score" id="quizScore"></div>`;
}
function nextQuizQuestion(){
  answered = false;
  const msg = document.getElementById('quizMsg');
  if(msg){ msg.textContent=''; msg.className='quiz-msg'; }
  if(quizIdx >= quizOrder.length){
    if(quizScore > bestScore){ bestScore = quizScore; saveProgress(); }
    quizPanel.innerHTML = `
      <div class="quiz-done">
        <div>انتهى الاختبار 🎉</div>
        <div class="big">${quizScore}/${quizTotal}</div>
        <div class="best">أفضل نتيجة محفوظة: ${bestScore}</div>
        <button class="restart-btn" id="restartBtn">إعادة المحاولة</button>
      </div>`;
    document.getElementById('restartBtn').addEventListener('click', startQuiz);
    return;
  }
  const o = byId[quizOrder[quizIdx]];
  quizPanel._answer = o.id;
  document.getElementById('quizAr').innerHTML = `${o.ar} <span class="en" style="display:block; font-size:13px; color:var(--sub); margin-top:6px;">find: ${o.en}</span>`;
  document.getElementById('quizScore').textContent = `السؤال ${quizIdx+1} من ${quizTotal} — النتيجة: ${quizScore}`;
  const distractors = shuffle(ORGANS.filter(x=>x.id!==o.id)).slice(0,3).map(x=>x.en);
  const choices = shuffle([o.en, ...distractors]);
  const choicesWrap = document.getElementById('quizChoices');
  choicesWrap.innerHTML = '';
  choices.forEach(label=>{
    const btn = document.createElement('button');
    btn.className='choice-btn'; btn.textContent = label;
    btn.addEventListener('click', ()=> checkQuizAnswer(label===o.en ? o.id : ORGANS.find(x=>x.en===label).id, btn));
    choicesWrap.appendChild(btn);
  });
}
function checkQuizAnswer(id, btnEl){
  if(answered || !quizPanel._answer) return;
  answered = true;
  const correctId = quizPanel._answer;
  const correct = id === correctId;
  document.querySelectorAll('.choice-btn').forEach(b=>{
    b.disabled = true;
    if(b.textContent === byId[correctId].en) b.classList.add('correct');
    else if(b===btnEl && !correct) b.classList.add('wrong');
  });
  const msg = document.getElementById('quizMsg');
  msg.textContent = correct ? '✓ صحيح! أحسنت' : `✗ خطأ — الصحيح كان ${byId[correctId].en}`;
  msg.classList.add(correct ? 'ok':'no');
  speak(byId[correctId].en);
  if(correct) quizScore++;
  learned.add(correctId); updateProgress(); saveProgress(); renderList();
  quizPanel._answer = null;
  setTimeout(()=>{ quizIdx++; nextQuizQuestion(); }, 1300);
}
/* clicking the organ in 3D also answers the current quiz question */
const origSelect = selectOrgan;
selectOrgan = function(id){
  origSelect(id);
  if(quizPanel.style.display==='flex' && quizPanel._answer && !answered) checkQuizAnswer(id, null);
};
</script>
</body>
