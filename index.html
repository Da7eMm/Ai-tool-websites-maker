<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex AI Client-Side Failover Router | الموجه الذكي للنماذج</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #030712;
            --primary-light: #1e293b;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --danger: #ef4444;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1);
            --transition: all 0.35s ease;
        }

        [data-theme="dark"] {
            --primary: #f8fafc;
            --primary-light: #e2e8f0;
            --bg-main: #020617;
            --bg-card: #0f172a;
            --text-main: #f3f4f6;
            --text-muted: #94a3b8;
            --border: #1e293b;
            --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); line-height: 1.8; transition: var(--transition); padding-bottom: 4rem; }

        header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand { display: flex; align-items: center; gap: 12px; font-size: 1.5rem; font-weight: 900; color: var(--text-main); text-decoration: none; }
        .brand i { color: var(--accent); }

        .container { max-width: 900px; margin: 3rem auto; padding: 0 20px; }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: var(--shadow-lg);
            margin-bottom: 2rem;
        }

        h2 { font-size: 2rem; font-weight: 900; margin-bottom: 1rem; }
        h2 span { color: var(--accent); }
        p { color: var(--text-muted); margin-bottom: 1.5rem; }

        .api-keys-box {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 1.5rem;
        }

        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 0.9rem; font-weight: 700; color: var(--text-main); }
        .input-group input {
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px;
            border-radius: 10px;
            outline: none;
            font-size: 0.95rem;
        }

        textarea {
            width: 100%;
            height: 130px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            resize: none;
            outline: none;
            margin-bottom: 1rem;
        }

        .btn {
            background: var(--accent);
            color: var(--primary);
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 1.05rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn:hover { background: var(--accent-hover); transform: translateY(-2px); }

        .result-box {
            background: var(--bg-main);
            border: 1px solid var(--border);
            padding: 1.8rem;
            border-radius: 14px;
            margin-top: 2rem;
            display: none;
            border-right: 5px solid var(--accent);
        }

        .model-badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 800;
            margin-bottom: 12px;
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <a href="#" class="brand"><i class="fa-solid fa-brain"></i> Apex AI Router</a>
        <button class="btn" style="padding: 8px 16px; font-size: 0.9rem;" onclick="toggleTheme()"><i class="fa-solid fa-circle-half-stroke"></i> تبديل الوضع</button>
    </header>

    <div class="container">
        <div class="card">
            <h2>منظومة التوجيه التلقائي <span>Claude ➔ GPT ➔ Gemini</span></h2>
            <p>أدخل مفاتيح الـ API الخاصة بك لمرة واحدة. إذا انتهت التجربة أو الرصيد على النموذج الأول، سيتحول النظام فوراً للنموذج التالي بكفاءة تامة.</p>
            
            <div class="api-keys-box">
                <div class="input-group">
                    <label>مفتاح Anthropic Claude API Key</label>
                    <input type="password" id="claudeKey" placeholder="sk-ant-...">
                </div>
                <div class="input-group">
                    <label>مفتاح OpenAI GPT-4o API Key</label>
                    <input type="password" id="openaiKey" placeholder="sk-proj-...">
                </div>
            </div>

            <textarea id="promptInput" placeholder="اكتب طلبك هنا (مثلاً: ابنِ لي واجهة برمجية لموقع تسوق)..."></textarea>
            <button class="btn" id="sendBtn" onclick="runClientSideFailover()">تنفيذ الطلب عبر الموجه الذكي</button>

            <div class="result-box" id="resultContainer">
                <div class="model-badge" id="usedModelBadge">النموذج المستخدم: جاري الفحص...</div>
                <div id="aiResponseText" style="white-space: pre-wrap; line-height: 1.8; margin-top: 10px;"></div>
            </div>
        </div>
    </div>

    <script>
        async function runClientSideFailover() {
            const prompt = document.getElementById('promptInput').value;
            const claudeKey = document.getElementById('claudeKey').value;
            const openaiKey = document.getElementById('openaiKey').value;
            
            if(!prompt) return alert('الرجاء كتابة الطلب أولاً!');

            const btn = document.getElementById('sendBtn');
            const resBox = document.getElementById('resultContainer');
            const badge = document.getElementById('usedModelBadge');
            const textOut = document.getElementById('aiResponseText');

            btn.innerText = "جاري الفحص والتبديل التلقائي بين النماذج...";
            btn.disabled = true;
            resBox.style.display = 'none';

            let success = false;
            let responseContent = "";
            let modelUsedName = "";

            // 1. المحاولة الأولى عبر Claude
            if(claudeKey && !success) {
                try {
                    badge.innerText = "جاري تجربة المحرك الأساسي: Claude 3.5 Sonnet...";
                    const res = await fetch("https://api.anthropic.com/v1/messages", {
                        method: "POST",
                        headers: {
                            "x-api-key": claudeKey,
                            "anthropic-version": "2023-06-01",
                            "content-type": "application/json",
                            "anthropic-dangerous-direct-browser-access": "true"
                        },
                        body: JSON.stringify({
                            model: "claude-3-5-sonnet-20241022",
                            max_tokens: 1500,
                            messages: [{ role: "user", content: prompt }]
                        })
                    });

                    if(res.ok) {
                        const data = await res.json();
                        responseContent = data.content[0].text;
                        modelUsedName = "Claude 3.5 Sonnet (المحرك الأساسي)";
                        success = true;
                    } else {
                        console.warn("فشل Claude، جاري التحويل للنموذج التالي...");
                    }
                } catch(e) {
                    console.warn("خطأ في اتصال Claude، جاري التخطي...");
                }
            }

            // 2. المحاولة الثانية عبر GPT-4o (Fallback)
            if(openaiKey && !success) {
                try {
                    badge.innerText = "انتهت تجربة Claude أو تعذر الاتصال.. جاري التبديل إلى GPT-4o...";
                    const res = await fetch("https://api.openai.com/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${openaiKey}`,
                            "content-type": "application/json"
                        },
                        body: JSON.stringify({
                            model: "gpt-4o",
                            messages: [{ role: "user", content: prompt }]
                        })
                    });

                    if(res.ok) {
                        const data = await res.json();
                        responseContent = data.choices[0].message.content;
                        modelUsedName = "GPT-4o (المحرك الاحتياطي الأول)";
                        success = true;
                    } else {
                        console.warn("فشل GPT-4o أيضاً...");
                    }
                } catch(e) {
                    console.warn("خطأ في اتصال OpenAI...");
                }
            }

            resBox.style.display = 'block';
            if(success) {
                badge.innerText = "تم التنفيذ بنجاح عبر: " + modelUsedName;
                textOut.innerText = responseContent;
            } else {
                badge.innerText = "فشلت العملية";
                textOut.innerText = "عذراً، لم يتم إدخال مفاتيح صحيحة أو نفدت التجارب لجميع النماذج المضافة.";
            }

            btn.innerText = "تنفيذ الطلب عبر الموجه الذكي";
            btn.disabled = false;
        }

        function toggleTheme() {
            const body = document.body;
            body.setAttribute('data-theme', body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }
    </script>
</body>
</html>
